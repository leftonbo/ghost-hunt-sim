<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👻 おばけの追いかけっこシミュレーター</title>
</head>
<body>

<!-- 情報パネル -->
<div id="info-panel">
  <div class="stat"><span class="label" data-i18n="ui.info.ghostCount">👻 おばけ:</span><span class="value" id="ghost-count">0</span></div>
  <div class="stat"><span class="label" data-i18n="ui.info.humanCount">🧑 ニンゲン:</span><span class="value" id="human-count">0</span></div>
  <div class="stat"><span class="label" data-i18n="ui.info.lanternCount">🔦 ランタン:</span><span class="value" id="lantern-count">0</span></div>
  <div class="stat"><span class="label" data-i18n="ui.info.elapsedTime">⏱️ 経過:</span><span class="value" id="elapsed-time">0:00</span></div>
</div>

<!-- キャンバス -->
<div id="canvas-container">
  <canvas id="sim-canvas"></canvas>
  <div id="end-overlay">
    <div class="end-title" data-i18n="ui.end.title">👻 おばけの世界になりました！</div>
    <div class="end-stats" id="end-stats"></div>
  </div>
</div>

<!-- 操作パネル -->
<div id="control-panel">
  <button id="btn-play" data-i18n="ui.controls.play.start">▶ 開始</button>
  <button id="btn-reset" data-i18n="ui.controls.reset">🔄 リセット</button>

  <div class="slider-group">
    <label data-i18n="ui.controls.speed">⚡ 速度:</label>
    <input type="range" id="slider-speed" min="5" max="30" value="10">
    <span class="slider-value" id="val-speed">1.0x</span>
  </div>

  <button id="btn-settings" title="詳細設定" aria-label="詳細設定" data-i18n-title="ui.controls.settingsTitle" data-i18n-aria-label="ui.controls.settingsTitle">☰</button>
</div>

<!-- 設定パネルオーバーレイ -->
<div id="settings-overlay"></div>

<!-- 設定パネル -->
<div id="settings-panel">
  <div class="settings-header">
    <span data-i18n="ui.settings.title">⚙️ 詳細設定</span>
    <button id="btn-close-settings" title="閉じる" aria-label="閉じる" data-i18n-title="ui.controls.close" data-i18n-aria-label="ui.controls.close">✕</button>
  </div>

  <div class="settings-section">
    <div class="section-title" data-i18n="ui.settings.sections.ghost">👻 おばけ設定</div>
    <div class="slider-group">
      <label data-i18n="ui.settings.ghostMode.label">モード:</label>
      <select id="select-ghost-mode">
        <option value="random" data-i18n="ui.settings.ghostMode.options.random">ランダム</option>
        <option value="hard" data-i18n="ui.settings.ghostMode.options.hard">ハードモード</option>
        <option value="normal" data-i18n="ui.settings.ghostMode.options.normal">ノーマル固定</option>
        <option value="feral" data-i18n="ui.settings.ghostMode.options.feral">フェラル固定</option>
        <option value="suction" data-i18n="ui.settings.ghostMode.options.suction">すいこみ固定</option>
        <option value="tongue" data-i18n="ui.settings.ghostMode.options.tongue">べろべろ固定</option>
      </select>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.ghostCount">初期おばけ:</label>
      <input type="range" id="slider-ghosts" min="1" max="10" value="1">
      <span class="slider-value" id="val-ghosts">1</span>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.ghostSpeed">移動速度:</label>
      <input type="range" id="slider-ghost-speed" min="5" max="50" value="20" step="1">
      <span class="slider-value" id="val-ghost-speed">2.0</span>
    </div>
  </div>

  <div class="settings-section">
    <div class="section-title" data-i18n="ui.settings.sections.human">🧑 ニンゲン設定</div>
    <div class="slider-group">
      <label data-i18n="ui.settings.humanCount">初期ニンゲン:</label>
      <input type="range" id="slider-humans" min="5" max="200" value="50">
      <span class="slider-value" id="val-humans">50</span>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.humanSpeed">移動速度:</label>
      <input type="range" id="slider-human-speed" min="5" max="50" value="25" step="1">
      <span class="slider-value" id="val-human-speed">2.5</span>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.maxHealth">生気最大値:</label>
      <input type="range" id="slider-max-health" min="10" max="500" value="100" step="10">
      <span class="slider-value" id="val-max-health">100</span>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.maxStamina">スタミナ最大値:</label>
      <input type="range" id="slider-max-stamina" min="10" max="500" value="100" step="10">
      <span class="slider-value" id="val-max-stamina">100</span>
    </div>
    <div class="slider-group">
      <label data-i18n="ui.settings.escapeRate">もがき力:</label>
      <input type="range" id="slider-escape-rate" min="1" max="30" value="8" step="1">
      <span class="slider-value" id="val-escape-rate">0.8</span>
    </div>
  </div>

  <div class="settings-section">
    <div class="section-title" data-i18n="ui.settings.sections.item">🔦 アイテム設定</div>
    <div class="slider-group">
      <label data-i18n="ui.settings.lanternCount">ランタン:</label>
      <input type="range" id="slider-lanterns" min="0" max="30" value="7">
      <span class="slider-value" id="val-lanterns">7</span>
    </div>
  </div>

  <div class="settings-section">
    <div class="section-title" data-i18n="ui.settings.sections.language">🌍 言語設定</div>
    <div class="slider-group">
      <label data-i18n="ui.settings.language.label">言語:</label>
      <select id="select-language">
        <option value="ja" data-i18n="ui.settings.language.options.ja">日本語</option>
        <option value="en" data-i18n="ui.settings.language.options.en">English</option>
      </select>
    </div>
  </div>

  <div class="settings-footer">
    <button id="btn-defaults" data-i18n="ui.settings.defaults">🔄 デフォルトに戻す</button>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
